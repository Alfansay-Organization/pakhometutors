<form id="teacherForm" enctype="multipart/form-data">

  <label for="fullName">Full name</label>
  <input type="text" id="fullName" placeholder="Full Name" required>

  <label for="email">Email address</label>
  <input type="email" id="email" placeholder="Email" required>

  <label for="city">City</label>
  <input type="text" id="city" placeholder="City" required>

  <label for="experience">Years of experience</label>
  <input type="number" id="experience" placeholder="Years of Experience" min="0" required>

  <label for="teachingMode">Teaching mode</label>
  <select id="teachingMode" required>
    <option value="">-- Select Teaching Mode --</option>
    <option value="home">Home</option>
    <option value="online">Online</option>
    <option value="both">Both</option>
  </select>

  <label for="photoFile">Profile photo</label>
  <input type="file" id="photoFile" accept="image/*" required>

  <label for="docFile">Verification document (PDF)</label>
  <input type="file" id="docFile" accept="application/pdf" required>

  <button type="submit">Submit Profile</button>

</form>
<script type="module" src="firebase-register.js"></script>
